[package]
name = "rust-echo-music"
version = "1.0.0"
description = "A desktop music player built with Rust and Tauri"
authors = ["Kino"]
edition = "2021"

[lib]
name = "rust_echo_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-audio-api = "1.7.0"
lofty = "0.25.1"
base64 = "0.23.1"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
trash = "5.2.6"
souvlaki = "0.8.3"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
rand = "0.10.2"
tokio = { version = "1.53.1", features = ["fs"] }
libloading = "0.9"
plugin-sdk = { path = "crates/plugin-sdk" }
plugin-runtime = { path = "crates/plugin-runtime" }
lyrics-plugin = { path = "crates/lyrics-plugin" }
eq-plugin = { path = "crates/eq-plugin" }
recent-plugin = { path = "crates/recent-plugin" }
